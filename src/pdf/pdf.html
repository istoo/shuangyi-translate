<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title data-i18n="pdfTitle">栖译 · PDF 翻译</title>
  <link rel="stylesheet" href="pdf.css" />
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo">双</span><span data-i18n="pdfTitle">栖译 · PDF 翻译</span></div>
  <div class="actions">
    <span id="summary" class="summary"></span>
    <button id="openAnother" class="ghost" data-i18n="pdfOpenAnother" hidden>打开其它 PDF</button>
    <button id="translateAll" class="ghost" data-i18n="pdfTranslateAll" hidden>翻译全文</button>
    <button id="exportBtn" class="ghost" data-i18n="pdfExport" hidden>导出 Markdown</button>
  </div>
</header>

<main>
  <section id="drop" class="drop">
    <div class="drop-icon">PDF</div>
    <p><span data-i18n="pdfDropHint">把 PDF 文件拖到这里，或者</span></p>
    <button id="pickFile" class="primary" data-i18n="pdfPickFile">选择文件</button>
    <p class="hint" data-i18n="pdfLimitHint">只支持带文本层的 PDF。</p>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
  </section>

  <p id="status" class="status" hidden></p>
  <div id="content" class="content" hidden></div>
</main>

<script type="module" src="pdf.js"></script>
</body>
</html>
