name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --omit=optional
      # 离线测试（不需要浏览器）：模板渲染、段落重建、i18n 完整性、后台缓存、DOM 交互
      - run: npm test
