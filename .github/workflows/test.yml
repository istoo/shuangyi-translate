name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 要求 Node >= 22.22.2（Node 20 已过维护期）
          node-version: '22'
          cache: npm
      - run: npm ci --omit=optional
      # 离线测试（不需要浏览器）：模板渲染、段落重建、i18n 完整性、后台缓存、DOM 交互
      - run: npm test
